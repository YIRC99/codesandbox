apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-sandbox-deployment
  labels:
    app.kubernetes.io/name: code-sandbox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: code-sandbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: code-sandbox
    spec:
      serviceAccountName: code-sandbox
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: code-sandbox
          image: code-sandbox
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 32004
          envFrom:
            - configMapRef:
                name: code-sandbox-config
          env:
            - name: SANDBOX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: code-sandbox-secret
                  key: api-key
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 256Mi
            limits:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
            - name: data-files
              mountPath: /data/data-files
            - name: tmp
              mountPath: /tmp
            - name: analysis-results
              mountPath: /data/analysis-results
      volumes:
        - name: uploads
          emptyDir:
            sizeLimit: 512Mi
        - name: data-files
          emptyDir:
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: analysis-results
          emptyDir:
            sizeLimit: 320Mi
